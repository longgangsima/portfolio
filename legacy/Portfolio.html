<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; }
    body { font-family: 'DM Sans', sans-serif; background: var(--c-bg); color: var(--c-text); }

    :root {
      --c-bg: #f7f6f2;
      --c-surface: #ffffff;
      --c-border: #e6e5e1;
      --c-text: #111111;
      --c-text-2: #666666;
      --c-text-3: #aaaaaa;
      --c-accent: #0d6b4c;
      --c-accent-dim: #e4f0eb;
      --c-accent-text: #0d6b4c;
      --sidebar-w: 260px;
      --nav-h: 52px;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 2px; }

    a { color: inherit; text-decoration: none; }
    a:hover { text-decoration: underline; }

    .nav {
      position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h);
      background: var(--c-surface); border-bottom: 1.5px solid var(--c-border);
      display: flex; align-items: center; padding: 0 28px;
      z-index: 100;
    }
    .nav-name {
      font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 800;
      color: var(--c-text); letter-spacing: -0.02em; flex: 1;
    }
    .nav-links { display: flex; align-items: center; gap: 28px; }
    .nav-link {
      font-family: 'Space Mono', monospace; font-size: 11px;
      color: var(--c-text-3); cursor: pointer; transition: color 0.15s;
    }
    .nav-link:hover { color: var(--c-text); }
    .nav-resume {
      font-family: 'Space Mono', monospace; font-size: 10px;
      color: var(--c-accent); border: 1.5px solid var(--c-accent);
      padding: 5px 12px; border-radius: 3px; cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .nav-resume:hover { background: var(--c-accent); color: #fff; }

    .layout {
      position: fixed; top: var(--nav-h); left: 0; right: 0; bottom: 0;
      display: flex;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--c-surface); border-right: 1.5px solid var(--c-border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .sidebar-scroll { flex: 1; overflow-y: auto; }
    .sidebar-section-label {
      font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
      color: var(--c-text-3); letter-spacing: 0.12em;
      padding: 14px 18px 8px; display: block;
    }
    .proj-item {
      display: flex; flex-direction: column; gap: 2px;
      padding: 10px 18px; cursor: pointer;
      border-left: 3px solid transparent;
      border-bottom: 1px solid var(--c-border);
      transition: background 0.12s, border-color 0.12s;
    }
    .proj-item:hover { background: var(--c-bg); }
    .proj-item.active {
      background: var(--c-accent-dim);
      border-left-color: var(--c-accent);
    }
    .proj-item-title {
      font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
      color: var(--c-text);
    }
    .proj-item.active .proj-item-title { color: var(--c-accent-text); }
    .proj-item-meta {
      font-family: 'Space Mono', monospace; font-size: 9px; color: var(--c-text-3);
    }

    .exp-item {
      padding: 7px 18px; border-bottom: 1px solid var(--c-border);
    }
    .exp-company {
      font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
      color: var(--c-text-2);
    }
    .exp-role {
      font-family: 'DM Sans', sans-serif; font-size: 11px; color: var(--c-text-3);
      margin-top: 1px;
    }
    .exp-dates {
      font-family: 'Space Mono', monospace; font-size: 8px; color: var(--c-text-3);
    }

    .skills-area { padding: 10px 18px 18px; }
    .skills-grid { display: flex; flex-wrap: wrap; gap: 4px; }
    .skill-chip {
      font-family: 'Space Mono', monospace; font-size: 8px;
      color: var(--c-text-2); background: var(--c-bg);
      border: 1px solid var(--c-border); padding: 2px 7px; border-radius: 2px;
    }

    /* ── Right panel ── */
    .panel {
      flex: 1; overflow-y: auto;
      background: var(--c-bg); padding: 40px 48px;
    }

    /* Hero / About state */
    .hero-name {
      font-family: 'Syne', sans-serif; font-size: 52px; font-weight: 800;
      line-height: 1; letter-spacing: -0.03em; color: var(--c-text);
    }
    .hero-title {
      font-family: 'Space Mono', monospace; font-size: 11px;
      color: var(--c-accent); margin-top: 10px; letter-spacing: 0.04em;
    }
    .hero-bio {
      font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.65;
      color: var(--c-text-2); margin-top: 16px; max-width: 520px;
    }
    .hero-links { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    .hero-btn {
      font-family: 'Space Mono', monospace; font-size: 10px;
      color: var(--c-text); border: 1.5px solid var(--c-border);
      padding: 6px 14px; border-radius: 3px; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      display: inline-block;
    }
    .hero-btn:hover { border-color: var(--c-accent); color: var(--c-accent); text-decoration: none; }
    .hero-btn.primary {
      background: var(--c-text); color: #fff; border-color: var(--c-text);
    }
    .hero-btn.primary:hover { background: var(--c-accent); border-color: var(--c-accent); color: #fff; }

    .section-divider { border: none; border-top: 1.5px solid var(--c-border); margin: 32px 0; }

    /* Project detail */
    .pd-tag {
      font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
      color: var(--c-accent); letter-spacing: 0.1em;
    }
    .pd-title {
      font-family: 'Syne', sans-serif; font-size: 36px; font-weight: 800;
      color: var(--c-text); line-height: 1.1; letter-spacing: -0.02em; margin-top: 6px;
    }
    .pd-tagline {
      font-family: 'DM Sans', sans-serif; font-size: 15px; color: var(--c-text-2);
      margin-top: 6px; line-height: 1.5;
    }
    .pd-action-row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
    .pd-btn {
      font-family: 'Space Mono', monospace; font-size: 10px;
      padding: 7px 16px; border-radius: 3px; cursor: pointer;
      border: 1.5px solid var(--c-border); color: var(--c-text-2);
      transition: all 0.15s; display: inline-block;
    }
    .pd-btn:hover { border-color: var(--c-accent); color: var(--c-accent); text-decoration: none; }
    .pd-btn.filled {
      background: var(--c-accent); border-color: var(--c-accent); color: #fff;
    }
    .pd-btn.filled:hover { opacity: 0.85; text-decoration: none; }

    .screenshot-box {
      width: 100%; margin: 24px 0;
      border-radius: 6px; overflow: hidden;
      border: 1.5px solid var(--c-border);
      background: var(--c-surface);
      position: relative;
    }
    .screenshot-inner {
      width: 100%; aspect-ratio: 16/9;
      background: repeating-linear-gradient(
        45deg, #ebebeb 0px, #ebebeb 1px, transparent 1px, transparent 10px
      );
      display: flex; align-items: center; justify-content: center;
    }
    .screenshot-label {
      font-family: 'Space Mono', monospace; font-size: 10px; color: #bbb;
      background: var(--c-surface); padding: 4px 10px; border-radius: 2px;
    }

    .pd-section-title {
      font-family: 'Space Mono', monospace; font-size: 9px; font-weight: 700;
      color: var(--c-text-3); letter-spacing: 0.12em; margin-bottom: 10px;
    }

    .pd-block { font-size: 14px; line-height: 1.7; color: var(--c-text-2); }

    .highlights-list { display: flex; flex-direction: column; gap: 8px; }
    .highlight-item { display: flex; gap: 10px; align-items: flex-start; }
    .highlight-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--c-accent); flex-shrink: 0; margin-top: 7px;
    }
    .highlight-text {
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      color: var(--c-text-2); line-height: 1.6;
    }

    .stack-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .stack-chip {
      font-family: 'Space Mono', monospace; font-size: 10px;
      color: var(--c-text-2); background: var(--c-surface);
      border: 1px solid var(--c-border); padding: 3px 9px; border-radius: 2px;
    }

    .thumb-grid { display: flex; gap: 12px; margin-top: 16px; }
    .thumb-box {
      flex: 1; aspect-ratio: 4/3; border-radius: 4px; overflow: hidden;
      border: 1.5px solid var(--c-border);
      background: repeating-linear-gradient(
        -45deg, #ebebeb 0px, #ebebeb 1px, transparent 1px, transparent 10px
      );
      display: flex; align-items: center; justify-content: center;
    }
    .thumb-label {
      font-family: 'Space Mono', monospace; font-size: 8px; color: #ccc;
    }

    .exp-full-item {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 14px 0; border-bottom: 1px solid var(--c-border);
      gap: 12px;
    }
    .exp-full-company {
      font-family: 'Space Mono', monospace; font-size: 11px; font-weight: 700;
      color: var(--c-text);
    }
    .exp-full-role {
      font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--c-text-2);
      margin-top: 2px;
    }
    .exp-full-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
    .exp-full-tag {
      font-family: 'Space Mono', monospace; font-size: 8px; color: var(--c-text-3);
      background: var(--c-bg); border: 1px solid var(--c-border);
      padding: 2px 6px; border-radius: 2px;
    }
    .exp-full-dates {
      font-family: 'Space Mono', monospace; font-size: 9px; color: var(--c-text-3);
      white-space: nowrap; flex-shrink: 0;
    }

    /* Transitions */
    .panel-content { animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* Responsive sidebar collapse */
    @media (max-width: 700px) {
      :root { --sidebar-w: 200px; }
      .panel { padding: 24px 20px; }
      .hero-name { font-size: 36px; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ──────────────────────────────────────────────────
   COMPONENTS
────────────────────────────────────────────────── */

function Screenshot({ label = 'project screenshot' }) {
  return (
    <div className="screenshot-box">
      <div className="screenshot-inner">
        <span className="screenshot-label">[ {label} ]</span>
      </div>
    </div>
  );
}

function Thumb({ label }) {
  return (
    <div className="thumb-box">
      <span className="thumb-label">{label}</span>
    </div>
  );
}

/* ── Nav ── */
function Nav({ onAbout }) {
  return (
    <nav className="nav">
      <span className="nav-name" style={{ cursor: 'pointer' }} onClick={onAbout}>

/* ── Sidebar ── */
function Sidebar({ active, setActive }) {
  return (
    <aside className="sidebar">
      <div className="sidebar-scroll">
        <span className="sidebar-section-label">PROJECTS</span>

          <div

/* ── Hero / About panel ── */

/* ── Project Detail panel ── */
function ProjectDetail({ project }) {
  const { title, tagline, tag, year, stack, problem, solution, highlights, links, placeholder } = project;
  return (

/* ── Experience full view ── */

  );
}

/* ──────────────────────────────────────────────────
   TWEAKS
────────────────────────────────────────────────── */

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "#c96a00",
  "dark": false
}/*EDITMODE-END*/;

/* ──────────────────────────────────────────────────
   MAIN APP
────────────────────────────────────────────────── */

function App() {
  const [active, setActive] = React.useState(null); // null = hero/about
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply tweaks to CSS vars
  React.useEffect(() => {
    const root = document.documentElement;
    if (t.dark) {
      root.style.setProperty('--c-bg', '#141414');
      root.style.setProperty('--c-surface', '#1e1e1e');
      root.style.setProperty('--c-border', '#2a2a2a');
      root.style.setProperty('--c-text', '#eeeeee');
      root.style.setProperty('--c-text-2', '#999999');
      root.style.setProperty('--c-text-3', '#555555');
      root.style.setProperty('--c-accent-dim', '#0d2a20');
    } else {
      root.style.setProperty('--c-bg', '#f7f6f2');
      root.style.setProperty('--c-surface', '#ffffff');
      root.style.setProperty('--c-border', '#e6e5e1');
      root.style.setProperty('--c-text', '#111111');
      root.style.setProperty('--c-text-2', '#666666');
      root.style.setProperty('--c-text-3', '#aaaaaa');
      root.style.setProperty('--c-accent-dim', '#e4f0eb');
    }
    root.style.setProperty('--c-accent', t.accent);
    root.style.setProperty('--c-accent-text', t.accent);
  }, [t.dark, t.accent]);

  const handleViewWork = () => setActive(0);

  return (
    <>
      <Nav onAbout={() => setActive(null)} />
      <div className="layout">
        <Sidebar active={active} setActive={setActive} />
        <main className="panel">
          {active === null
            ? <HeroPanel onViewWork={handleViewWork} />
            : <ProjectDetail project={PROJECTS[active]} />
          }
        </main>
      </div>

      <TweaksPanel>
        <TweakSection label="Theme">
          <TweakToggle
            label="Dark mode"
            value={t.dark}
            onChange={v => setTweak('dark', v)}
          />
          <TweakColor
            label="Accent color"
            value={t.accent}
            options={['#0d6b4c', '#1a5fb4', '#9b2226', '#6e3d8e', '#c96a00']}
            onChange={v => setTweak('accent', v)}
          />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
