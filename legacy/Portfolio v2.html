    .hero-name em{color:var(--coral);font-style:normal;position:relative}
    .hero-name em::after{content:'';position:absolute;bottom:-6px;left:0;right:0;height:4px;background:var(--coral);border-radius:2px}
    .hero-bio{font-size:16px;line-height:1.7;color:var(--t2);max-width:420px;margin-bottom:32px}

      .pj-item:hover{padding-left:0;padding-right:0;margin:0}
    }

function useTypist(){
  const[li,setLi]=React.useState(0);
  const[ci,setCi]=React.useState(0);
  const[rows,setRows]=React.useState([]);
  const[done,setDone]=React.useState(false);
  React.useEffect(()=>{
    if(done)return;
    if(li>=TL.length){setDone(true);return;}
    const line=TL[li];
    if(line.t==='blank'){
      const t=setTimeout(()=>{setRows(r=>[...r,{...line}]);setLi(x=>x+1);setCi(0);},60);
      return()=>clearTimeout(t);
    }
    if(ci<line.text.length){
      const spd=line.t==='cmd'?55:line.t==='name'?45:18;
      const t=setTimeout(()=>{
        const p={...line,text:line.text.slice(0,ci+1)};
        setRows(r=>{const l=r[r.length-1];return l&&l.id===line.id?[...r.slice(0,-1),p]:[...r,p];});
        setCi(c=>c+1);
      },spd);
      return()=>clearTimeout(t);
    }
    const pause=line.t==='cmd'?380:line.t==='name'?180:65;
    const t=setTimeout(()=>{setLi(x=>x+1);setCi(0);},pause);
    return()=>clearTimeout(t);
  },[li,ci,done]);
  return{rows,done};
}

/* ─── COUNTER HOOK ─── */
function useCount(end,dur=1400){
  const[v,setV]=React.useState(0);
  const ref=React.useRef(null);
  const started=React.useRef(false);
  React.useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting&&!started.current){
        started.current=true;
        const t0=performance.now();
        const tick=t=>{const p=Math.min((t-t0)/dur,1);setV(Math.round((1-Math.pow(1-p,3))*end));if(p<1)requestAnimationFrame(tick);};
        requestAnimationFrame(tick);
      }
    },{threshold:.5});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  return[v,ref];
}

/* ─── FADE UP HOOK ─── */
function useFade(){
  const ref=React.useRef(null);
  React.useEffect(()=>{
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){e.target.classList.add('vis');obs.unobserve(e.target);}},{threshold:.1});
    if(ref.current)obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  return ref;
}

/* ─── CURSOR ─── */
function CursorFx(){
  const dot=React.useRef(null);
  const ring=React.useRef(null);
  const m=React.useRef({x:-100,y:-100});
  const p=React.useRef({x:-100,y:-100});
  React.useEffect(()=>{
    const mv=e=>{
      m.current={x:e.clientX,y:e.clientY};
      if(dot.current)dot.current.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;
    };
    let raf;
    const tick=()=>{
      p.current.x+=(m.current.x-p.current.x)*.1;
      p.current.y+=(m.current.y-p.current.y)*.1;
      if(ring.current)ring.current.style.transform=`translate(${p.current.x}px,${p.current.y}px)`;
      raf=requestAnimationFrame(tick);
    };
    tick();
    document.addEventListener('mousemove',mv);
    return()=>{document.removeEventListener('mousemove',mv);cancelAnimationFrame(raf);};
  },[]);
  return(<><div ref={dot} className="cur-dot"/><div ref={ring} className="cur-ring"/></>);
}

/* ─── BUG HUNT GAME ─── */
function BugHunt(){
  const[phase,setPhase]=React.useState('idle');
  const[score,setScore]=React.useState(0);
  const[timer,setTimer]=React.useState(30);
  const[cells,setCells]=React.useState(Array(12).fill('idle'));
  const sc=React.useRef(0);
  const iv=React.useRef({});
  const ref=useFade();

  React.useEffect(()=>()=>{clearInterval(iv.current.t);clearInterval(iv.current.s);},[]);

  const start=()=>{
    clearInterval(iv.current.t);clearInterval(iv.current.s);
    setPhase('playing');setScore(0);sc.current=0;setTimer(30);setCells(Array(12).fill('idle'));
    iv.current.t=setInterval(()=>{
      setTimer(t=>{
        if(t<=1){clearInterval(iv.current.t);clearInterval(iv.current.s);setCells(Array(12).fill('idle'));setPhase('done');setScore(sc.current);return 0;}
        return t-1;
      });
    },1000);
    iv.current.s=setInterval(()=>{
      const idx=Math.floor(Math.random()*12);
      setCells(p=>{if(p[idx]!=='idle')return p;const n=[...p];n[idx]='bug';return n;});
      setTimeout(()=>setCells(p=>{if(p[idx]!=='bug')return p;const n=[...p];n[idx]='idle';return n;}),1350);
    },520);
  };

  const click=i=>{
    if(cells[i]!=='bug')return;
    sc.current+=1;setScore(sc.current);
    setCells(p=>{const n=[...p];n[i]='fx';return n;});
    setTimeout(()=>setCells(p=>{if(p[i]!=='fx')return p;const n=[...p];n[i]='idle';return n;}),320);
  };

  const msg=s=>s>=22?'🎭 Playwright team wants you':s>=15?'🔍 Solid debugging instincts':s>=8?'☕ Needs more coffee':' 😅 More bugs shipped than fixed';

  return(
    <section className="game-sec blue-tint sec" id="game">
      <div className="fade-up ctr" style={{textAlign:'center'}} ref={ref}>
        <div className="sec-tag" style={{marginBottom:8}}>MINI GAME</div>
        <h2 className="sec-h" style={{marginBottom:12}}>Meanwhile, in production…</h2>
        <p className="game-sub">
          Bugs keep appearing in the codebase.<br/>
          Fix them before they take down the pipeline.
          {phase==='idle'&&<><br/><span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--t3)'}}>30 seconds · click the red cells · go!</span></>}
          {phase==='playing'&&<><br/><span style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--coral)'}}>{timer}s remaining · bugs fixed: {score}</span></>}
        </p>

        {phase!=='done'&&(
          <div className="gw" style={{margin:'0 auto'}}>
            <div className="g-topbar">
              <span className="g-ttl">production · main · {phase==='playing'?'🔴 LIVE':'● IDLE'}</span>
              {phase==='playing'&&<span className="g-sc">score: {score}</span>}
            </div>
            {phase==='playing'&&(
              <div className="timer-o">
                <div className="timer-i" style={{width:`${(timer/30)*100}%`,background:timer<=10?'#ef4444':'var(--coral)'}}/>
              </div>
            )}
            <div className="g-grid">
              {cells.map((st,i)=>(
                <div key={i} className={`g-cell${st==='bug'?' bug':st==='fx'?' fx':''}`} onClick={()=>click(i)}>
                  <span className="g-fn">{FILES[i]}</span>
                  <span className={`g-st ${st==='idle'?'g-idle':st==='bug'?'g-bug':'g-fix'}`}>
                    {st==='idle'&&'· OK'}{st==='bug'&&'⚠ [BUG DETECTED]'}{st==='fx'&&'✓ FIXED'}
                  </span>
                </div>
              ))}
            </div>
            {phase==='idle'&&<div style={{textAlign:'center'}}><button className="g-btn" onClick={start}>./run-debugger.sh ▶</button></div>}
          </div>
        )}

        {phase==='done'&&(
          <div className="g-res">
            <div className="g-res-n">{score}</div>
            <div className="g-res-l">BUGS FIXED IN 30 SECONDS</div>
            <p className="g-res-c">{msg(score)}</p>
            <button className="g-btn" onClick={start}>./retry.sh ↺</button>
          </div>
        )}
      </div>
    </section>
  );
}
